<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Bespoken English — Staff Sign In</title>
<style>
  :root{
    --navy:#1E2761;
    --navy2:#141b4d;
    --ice:#CADCFC;
    --white:#FFFFFF;
    --gray:#9aa1b8;
    --line:#2c3568;
    --ok:#6fbf73;
    --warn:#e3a857;
    --bad:#e2637a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--navy2);
    color:var(--white);
    min-height:100vh;
  }
  .wrap{max-width:420px; margin:0 auto; padding:64px 20px 80px;}
  .badge{
    display:inline-block; padding:4px 12px; border-radius:999px; font-size:11.5px;
    font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    background:rgba(227,168,87,.15); color:var(--warn); border:1px solid var(--warn);
    margin-bottom:14px;
  }
  h1{font-family:Cambria,'Times New Roman',serif; margin:0 0 6px; font-size:26px;}
  .sub{color:var(--gray); font-size:13.5px; margin:0 0 28px; line-height:1.5;}
  .card{
    background:var(--navy); border:1px solid var(--line); border-radius:14px; padding:26px 24px;
  }
  label{display:block; font-size:13px; margin:14px 0 6px; color:var(--gray);}
  input[type=email], input[type=password]{
    width:100%; padding:11px 13px; border-radius:8px; border:1px solid var(--line);
    background:#0f1440; color:var(--white); font-size:14.5px; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--ice);}
  .btn{
    margin-top:22px; width:100%; padding:13px; border:none; border-radius:9px;
    background:var(--ice); color:var(--navy); font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .msg{margin-top:16px; padding:12px 14px; border-radius:8px; font-size:13.5px; line-height:1.5; display:none;}
  .msg.error{background:rgba(226,99,122,.15); color:#ff9d91; border:1px solid var(--bad); display:block;}
  .msg.ok{background:rgba(111,191,115,.15); color:#8fe0bb; border:1px solid var(--ok); display:block;}
  .switch{text-align:center; margin-top:20px; font-size:12.5px; color:var(--gray);}
  .switch a{color:var(--ice); text-decoration:underline;}
  .checking{text-align:center; color:var(--gray); padding:40px 0;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">Staff</div>
  <h1>Sign in</h1>
  <p class="sub">This is the staff sign-in for Bespoken English trainers and admins. If you're a student, use the regular sign-in instead.</p>

  <div class="card" id="loginCard">
    <div id="checkingView" class="checking hidden">Checking your access…</div>
    <div id="formView">
      <label for="li-email">Email address</label>
      <input type="email" id="li-email" autocomplete="email">
      <label for="li-pw">Password</label>
      <input type="password" id="li-pw" autocomplete="current-password">
      <button class="btn" id="loginBtn">Sign in</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </div>

  <div class="switch">Not staff? <a href="index.html">Go to the student sign-in</a></div>
</div>

<script>
(function(){
  "use strict";

  var SUPABASE_URL = "https://zqcwhsxaawmrckbglcim.supabase.co";
  var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpxY3doc3hhYXdtcmNrYmdsY2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2MDcwMTAsImV4cCI6MjA5OTE4MzAxMH0.Po9nINJ7rWtnP_iH6jyg322MvgW4ayrXLFbyJVrn8b4";
  var STORAGE_KEY = "bt-session";

  function saveSession(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }
  function loadSession(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); }
    catch(e){ return null; }
  }
  function clearSession(){ localStorage.removeItem(STORAGE_KEY); }

  function authFetch(path, opts){
    opts = opts || {};
    var session = loadSession();
    var headers = {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": "Bearer " + ((session && session.access_token) || ""),
      "Content-Type": "application/json"
    };
    if (opts.headers){ for (var k in opts.headers){ headers[k] = opts.headers[k]; } }
    opts.headers = headers;
    return fetch(SUPABASE_URL + path, opts);
  }

  function showMsg(el, text, isError){
    el.textContent = text;
    el.className = "msg " + (isError ? "error" : "ok");
  }

  function showChecking(on){
    document.getElementById("checkingView").classList.toggle("hidden", !on);
    document.getElementById("formView").classList.toggle("hidden", on);
  }

  function routeByRole(profile){
    if (profile && profile.is_admin){
      location.href = "admin.html";
    } else if (profile && profile.is_trainer){
      location.href = "trainer.html";
    } else {
      showChecking(false);
      var msgEl = document.getElementById("loginMsg");
      showMsg(msgEl, "This account doesn't have staff access. If you're a student, use the student sign-in link below.", true);
      var btn = document.getElementById("loginBtn");
      btn.disabled = false; btn.textContent = "Sign in";
    }
  }

  function checkExistingSession(){
    var session = loadSession();
    if (!session || !session.access_token){ return; }
    showChecking(true);
    authFetch("/auth/v1/user").then(function(res){
      if (!res.ok){ showChecking(false); return; }
      return res.json().then(function(user){
        return authFetch("/rest/v1/profiles?id=eq." + encodeURIComponent(user.id) + "&select=is_admin,is_trainer");
      });
    }).then(function(res){
      if (!res) return;
      return res.json();
    }).then(function(rows){
      if (!rows){ showChecking(false); return; }
      routeByRole(rows[0]);
    }).catch(function(){
      showChecking(false);
    });
  }

  document.getElementById("loginBtn").addEventListener("click", function(){
    var btn = this;
    var email = document.getElementById("li-email").value.trim();
    var pw = document.getElementById("li-pw").value;
    var msgEl = document.getElementById("loginMsg");
    if (!email || !pw){ showMsg(msgEl, "Enter your email and password.", true); return; }

    btn.disabled = true; btn.textContent = "Signing in…"; msgEl.className = "msg";

    fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password", {
      method: "POST",
      headers: { "apikey": SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: pw })
    }).then(function(res){
      return res.json().then(function(data){ return { ok: res.ok, data: data }; });
    }).then(function(result){
      if (!result.ok){
        showMsg(msgEl, result.data.error_description || "Incorrect email or password.", true);
        btn.disabled = false; btn.textContent = "Sign in";
        return;
      }
      var data = result.data;
      saveSession({
        access_token: data.access_token,
        refresh_token: data.refresh_token,
        expires_in: data.expires_in,
        issued_at: Date.now(),
        user: data.user
      });
      showChecking(true);
      return authFetch("/rest/v1/profiles?id=eq." + encodeURIComponent(data.user.id) + "&select=is_admin,is_trainer")
        .then(function(r){ return r.json(); })
        .then(function(rows){ routeByRole(rows[0]); });
    }).catch(function(){
      showMsg(msgEl, "Something went wrong reaching the server. Please try again.", true);
      btn.disabled = false; btn.textContent = "Sign in";
    });
  });

  checkExistingSession();
})();
</script>
</body>
</html>
